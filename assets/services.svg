<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img" aria-label="Services: Mobile apps, Web apps, n8n AI agents, i18n, Backend and APIs, Databases and Cloud">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,'Courier New',monospace}
    .in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}.d6{animation-delay:.8s}
    .bar{transform-box:fill-box;transform-origin:left center;animation:bar 4s ease-in-out infinite}
    .g2{animation-delay:-.7s}.g3{animation-delay:-1.4s}.g4{animation-delay:-2.1s}.g5{animation-delay:-2.8s}.g6{animation-delay:-3.5s}
    @keyframes bar{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
    .icon{fill:none;stroke:#ffffff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .chip rect{fill:#ffffff;fill-opacity:.05;stroke:#ffffff;stroke-opacity:.1}
    .chip text{font-size:13px;fill:#cbd5e1;text-anchor:middle}
  </style>

  <!-- 01 Mobile -->
  <g transform="translate(0 0)"><g class="in d1">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><rect x="19" y="13" width="18" height="30" rx="4"/><path d="M25 38h6"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">01</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">Mobile App Development</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">Cross-platform iOS &amp; Android apps with</tspan><tspan x="24" y="172">smooth UX, push alerts &amp; offline support.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="111" height="26" rx="13"/><text x="79.5" y="214">React Native</text></g>
    <g class="chip"><rect x="143" y="196" width="52" height="26" rx="13"/><text x="169" y="214">Expo</text></g>
    <g class="chip"><rect x="203" y="196" width="81" height="26" rx="13"/><text x="243.5" y="214">Firebase</text></g>
  </g></g>

  <!-- 02 Web -->
  <g transform="translate(412 0)"><g class="in d2">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar g2" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><rect x="12" y="15" width="32" height="26" rx="4"/><path d="M12 22h32M24 27l-4 4 4 4M32 27l4 4-4 4"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">02</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">Web App Development</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">SEO-friendly websites, SaaS platforms and</tspan><tspan x="24" y="172">admin dashboards built for speed &amp; scale.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="74" height="26" rx="13"/><text x="61" y="214">Next.js</text></g>
    <g class="chip"><rect x="106" y="196" width="56" height="26" rx="13"/><text x="134" y="214">MERN</text></g>
    <g class="chip"><rect x="170" y="196" width="74" height="26" rx="13"/><text x="207" y="214">Angular</text></g>
  </g></g>

  <!-- 03 AI -->
  <g transform="translate(824 0)"><g class="in d3">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar g3" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><rect x="15" y="21" width="26" height="20" rx="6"/><path d="M28 21v-6M24 36h8"/><circle cx="28" cy="13" r="2"/><circle cx="23" cy="29" r="1.6" fill="#fff"/><circle cx="33" cy="29" r="1.6" fill="#fff"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">03</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">n8n AI Agents</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">AI agents, chatbots and n8n workflows that</tspan><tspan x="24" y="172">automate tasks across your apps &amp; APIs.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="48" height="26" rx="13"/><text x="48" y="214">n8n</text></g>
    <g class="chip"><rect x="80" y="196" width="89" height="26" rx="13"/><text x="124.5" y="214">AI Agents</text></g>
    <g class="chip"><rect x="177" y="196" width="84" height="26" rx="13"/><text x="219" y="214">Webhooks</text></g>
  </g></g>

  <!-- 04 i18n -->
  <g transform="translate(0 276)"><g class="in d4">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar g4" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><circle cx="28" cy="28" r="13"/><ellipse cx="28" cy="28" rx="6" ry="13"/><path d="M15 28h26"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">04</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">i18n Multi-language</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">Multi-language apps with RTL support,</tspan><tspan x="24" y="172">locale formats and easy translation flows.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="74" height="26" rx="13"/><text x="61" y="214">i18next</text></g>
    <g class="chip"><rect x="106" y="196" width="48" height="26" rx="13"/><text x="130" y="214">RTL</text></g>
    <g class="chip"><rect x="162" y="196" width="74" height="26" rx="13"/><text x="199" y="214">Locales</text></g>
  </g></g>

  <!-- 05 Backend -->
  <g transform="translate(412 276)"><g class="in d5">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar g5" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><rect x="15" y="14" width="26" height="12" rx="3"/><rect x="15" y="30" width="26" height="12" rx="3"/><path d="M20 20h.01M20 36h.01M27 20h9M27 36h9"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">05</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">Backend &amp; APIs</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">Secure REST &amp; GraphQL APIs with auth,</tspan><tspan x="24" y="172">real-time features and integrations.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="74" height="26" rx="13"/><text x="61" y="214">Node.js</text></g>
    <g class="chip"><rect x="106" y="196" width="74" height="26" rx="13"/><text x="143" y="214">Express</text></g>
    <g class="chip"><rect x="188" y="196" width="78" height="26" rx="13"/><text x="227" y="214">GraphQL</text></g>
  </g></g>

  <!-- 06 Data -->
  <g transform="translate(824 276)"><g class="in d6">
    <rect width="376" height="240" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar g6" x="24" y="0" width="140" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="24" y="28" width="56" height="56" rx="16" fill="url(#iconbg)"/>
    <g transform="translate(24 28)" class="icon"><ellipse cx="28" cy="17" rx="12" ry="5"/><path d="M16 17v22c0 2.8 5.4 5 12 5s12-2.2 12-5V17M16 28c0 2.8 5.4 5 12 5s12-2.2 12-5"/></g>
    <text class="mono" x="352" y="52" text-anchor="end" font-size="14" fill="#334155">06</text>
    <text x="24" y="120" font-size="21" font-weight="700" fill="#f8fafc">Databases &amp; Cloud</text>
    <text font-size="15" fill="#94a3b8"><tspan x="24" y="150">SQL &amp; NoSQL data modeling on Firebase,</tspan><tspan x="24" y="172">Supabase, PostgreSQL, MySQL &amp; MongoDB.</tspan></text>
    <g class="chip"><rect x="24" y="196" width="84" height="26" rx="13"/><text x="66" y="214">Supabase</text></g>
    <g class="chip"><rect x="116" y="196" width="96" height="26" rx="13"/><text x="164" y="214">PostgreSQL</text></g>
    <g class="chip"><rect x="220" y="196" width="80" height="26" rx="13"/><text x="260" y="214">MongoDB</text></g>
  </g></g>
</svg>
