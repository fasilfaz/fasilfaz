<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Code Activity">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,'Courier New',monospace}
    .in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
    .d2{animation-delay:.15s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .bar{transform-box:fill-box;transform-origin:center;animation:bar 3s ease-in-out infinite}
    @keyframes bar{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1.4)}}
  </style>
  <g class="in"><text class="mono" x="600" y="30" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22d3ee">// 04 · GITHUB</text></g>
  <g class="in d2"><text x="600" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="url(#accent)">Code Activity</text></g>
  <rect class="bar" x="560" y="94" width="80" height="4" rx="2" fill="url(#accent)"/>
</svg>
